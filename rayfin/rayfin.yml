id: seismic-dashboard
name: Seismic Dashboard
version: 0.1.0
services:
  auth:
    enabled: true
    expiryInMinutes: 60
    refreshToken:
      lifetimeInDays: 30
    allowedRedirectUris:
      - http://localhost:5173
      - http://localhost:5173/auth/callback
      - https://fond-poppy-fcf5574772-westeurope.webapp.fabricapps.net
    fabric:
      enabled: true
    password:
      enabled: true
  data:
    enabled: true
    dialect: mssql
  storage:
    enabled: false
  staticHosting:
    enabled: true
    root: .
    folder: dist
    buildCommand: npm run build
    indexDocument: index.html
  functions:
    enabled: false
